<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'historial')}">

<head>
    <meta charset="UTF-8">
    <title>Detalle de Venta - Vendedor</title>
    <link rel="stylesheet" th:href="@{/css/historial_ventas-vendedor.css}" />
</head>

<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="fas fa-receipt text-primary"></i> Detalle de Venta</h2>
            <p class="text-muted mb-0" th:text="${venta != null ? 'Venta #' + venta.id : ''}"></p>
        </div>
        <div>
            <a class="btn btn-outline-secondary shadow-sm" th:href="@{/vendedor/ventas/historial}">
                <i class="fas fa-arrow-left me-2"></i> Volver
            </a>
        </div>
    </div>

    <div th:if="${venta == null}" class="alert alert-warning">
        Venta no encontrada.
    </div>

    <div th:if="${venta != null}" class="card shadow-sm">
        <div class="card-body p-4">
            <div class="row g-4 mb-3">
                <div class="col-md-6">
                    <div class="text-muted small">Cliente</div>
                    <div class="fw-bold" th:text="${venta.cliente != null ? venta.cliente.nombre : '-'}"></div>
                    <div class="text-muted small" th:text="${venta.cliente != null ? venta.cliente.telefono : ''}"></div>
                </div>
                <div class="col-md-3">
                    <div class="text-muted small">Método de pago</div>
                    <div class="fw-bold" th:text="${venta.metodoPago}"></div>
                </div>
                <div class="col-md-3">
                    <div class="text-muted small">Fecha</div>
                    <div class="fw-bold" th:text="${venta.fecha}"></div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${venta.detalles}">
                        <td th:text="${d.producto != null ? d.producto.nombre : '-'}"></td>
                        <td th:text="${d.cantidad}"></td>
                        <td th:text="${d.precioUnitario}"></td>
                        <td th:text="${d.subtotal}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="row justify-content-end mt-3">
                <div class="col-md-4">
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Subtotal</span>
                        <span th:text="${venta.subtotal}"></span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">IGV</span>
                        <span th:text="${venta.igv}"></span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span>
                        <span th:text="${venta.total}"></span>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <a class="btn btn-primary shadow-sm" th:href="@{/vendedor/ventas/{id}/boleta.pdf(id=${venta.id})}">
                    <i class="fas fa-file-pdf me-2"></i> Descargar boleta
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
