<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/sidebar_farmaceutico::layout(~{::div#content}, 'dashboard')}">
<head>
    <title>Panel de Farmacia - Pet Clinic</title>
    <link rel="stylesheet" th:href="@{/css/dashboard-farmaceutico.css}">
</head>
<body>
    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0 text-dark">Panel de Control Farmacéutico</h2>
                <p class="text-muted">Resumen de operaciones y estado crítico de inventario.</p>
            </div>
            <div>
                <a th:href="@{/farmaceutico/reportes/stock-bajo}" class="btn btn-danger btn-lg shadow-sm">
                    <i class="fas fa-file-pdf me-2"></i> Reporte Stock Crítico
                </a>
            </div>
        </div>

        <!-- Tarjetas de Resumen -->
        <div class="row g-4 mb-5">
            <!-- Ventas Hoy -->
            <div class="col-md-4">
                <div class="card-stat bg-success-gradient shadow-sm">
                    <div class="card-stat-body">
                        <div class="info">
                            <span class="label">Ventas de Hoy</span>
                            <h3 class="value" th:text="'S/ ' + ${ventasHoy}">S/ 0.00</h3>
                        </div>
                        <div class="icon-circle bg-white text-success">
                            <i class="fas fa-cash-register"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stock Bajo -->
            <div class="col-md-4">
                <div class="card-stat bg-warning-gradient shadow-sm clickable" th:onclick="|location.href='@{/farmaceutico/inventario}'|">
                    <div class="card-stat-body">
                        <div class="info">
                            <span class="label">Productos Stock Bajo</span>
                            <h3 class="value" th:text="${bajoStockCount}">0</h3>
                        </div>
                        <div class="icon-circle bg-white text-warning">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recetas -->
            <div class="col-md-4">
                <div class="card-stat bg-info-gradient shadow-sm clickable" th:onclick="|location.href='@{/farmaceutico/recetas}'|">
                    <div class="card-stat-body">
                        <div class="info">
                            <span class="label">Recetas Pendientes</span>
                            <h3 class="value" th:text="${recetasPendientes}">0</h3>
                        </div>
                        <div class="icon-circle bg-white text-info">
                            <i class="fas fa-prescription-bottle-alt"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Accesos Rápidos -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-4 text-primary"><i class="fas fa-rocket me-2"></i> Acciones Rápidas</h5>
                    <div class="d-flex gap-3">
                        <a th:href="@{/farmaceutico/ventas}" class="quick-action-btn">
                            <i class="fas fa-shopping-cart fa-2x mb-2 text-success"></i>
                            <span>Nueva Venta</span>
                        </a>
                        <a th:href="@{/farmaceutico/inventario}" class="quick-action-btn">
                            <i class="fas fa-boxes fa-2x mb-2 text-primary"></i>
                            <span>Gestionar Stock</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/dashboard.js}"></script>
    </div>
</body>
</html>
