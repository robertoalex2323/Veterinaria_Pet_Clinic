<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'registrar_venta')}">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta - Vendedor</title>
</head>
<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="fas fa-cart-plus text-primary"></i> Registrar Venta</h2>
            <p class="text-muted mb-0">Selecciona productos y registra la venta del cliente.</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong><i class="fas fa-user me-2"></i> Datos del Cliente</strong>
        </div>

        <div class="card-body">
            <form th:action="@{/vendedor/ventas/registrar}" method="post" id="ventaForm">

                <input type="hidden" name="clienteNombre" th:value="${clienteNombre != null ? clienteNombre : ''}"/>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input class="form-control" name="clienteNombre" required placeholder="Ej: Juan Perez"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Teléfono</label>
                        <input class="form-control" name="clienteTelefono" required placeholder="Ej: 999999999"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Email (opcional)</label>
                        <input class="form-control" name="clienteEmail" placeholder="Ej: juan@email.com"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Método de pago</label>
                        <select class="form-select" name="metodoPago" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Yape">Yape</option>
                            <option value="Plin">Plin</option>
                            <option value="Tarjeta">Tarjeta</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Dirección (opcional)</label>
                        <input class="form-control" name="clienteDireccion" placeholder="Ej: Av. Principal 123"/>
                    </div>
                </div>

                <hr class="my-4"/>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0"><i class="fas fa-box-open text-primary me-2"></i> Productos</h5>
                    <small class="text-muted">Marca “Sí” para agregar el producto a la venta.</small>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                        <tr>
                            <th style="width:70px;">Sí</th>
                            <th>Producto</th>
                            <th style="width:140px;">Stock</th>
                            <th style="width:160px;">Cantidad</th>
                            <th style="width:140px;">Precio</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${productos == null || #lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay productos disponibles.</td>
                        </tr>
                        <tr th:each="p : ${productos}">
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input"
                                       th:name="agregarProducto[]"
                                       th:value="${p.id}"/>
                            </td>
                            <td>
                                <div class="fw-semibold" th:text="${p.nombre}"></div>
                                <div class="text-muted small" th:text="${p.categoria}"></div>
                            </td>
                            <td>
                                <span class="badge bg-info" th:text="${p.stock}"></span>
                            </td>
                            <td>
                                <input type="number" class="form-control"
                                       min="1" max="999"
                                       th:name="cantidadProducto[__${p.id}__]"
                                       value="1"/>
                            </td>
                            <td>
                                <span th:text="${p.precio} + ' '" class="fw-semibold"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Estructura de envío: usamos arrays por producto seleccionado -->
                <!-- JS: convierte lo marcado en listas formales para el backend -->
                <div class="d-none">
                    <input type="hidden" name="productoIds" id="productoIds"/>
                    <input type="hidden" name="cantidades" id="cantidades"/>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='https://example.com'" style="display:none;">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i> Guardar Venta
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>

<script th:src="@{/js/Registrar-vendedor.js}"></script>

</body>
</html>
