<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'recomendaciones')}">
<head>
    <meta charset="UTF-8" />
    <title>Recomendaciones - Vendedor</title>
    <link rel="stylesheet" th:href="@{/css/recomendaciones-vendedor.css}" />
</head>
<body>
<div id="content">


    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="fas fa-wand-magic-sparkles text-primary"></i> Recomendaciones IA
            </h2>
            <p class="text-muted mb-0">Sugerencias automáticas basadas en tu catálogo y ventas recientes.</p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong><i class="fas fa-robot me-2"></i> Recomendador</strong>
        </div>

        <div class="card-body">

            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Mascota (opcional)</label>
                    <input id="petQuery" class="form-control" placeholder="Ej: perro, gato, cachorro, etc" />
                </div>

                <div class="col-md-4">
                    <label class="form-label">Preferencia</label>
                    <select id="prefQuery" class="form-select">
                        <option value="">Cualquiera</option>
                        <option value="descuento">Con descuento</option>
                        <option value="gastro">Digestivo</option>
                        <option value="piel">Piel y pelaje</option>
                        <option value="vacunas">Vacunas</option>
                    </select>
                </div>

                <div class="col-md-4 d-grid">
                    <button class="btn btn-primary" id="btnRecommend" th:attr="data-api-url=@{/vendedor/recomendaciones/api}">
                        <i class="fas fa-magic me-2"></i> Generar recomendaciones
                    </button>
                </div>
            </div>

            <hr class="my-4" />

            <div id="recommendationAlert" class="alert alert-info d-none" role="alert"></div>

            <div id="recommendationsGrid" class="row g-3">
                <!-- Render JS -->
            </div>

            <div class="mt-4">
                <small class="text-muted">
                    Nota: este “modo IA” es una recomendación inteligente basada en reglas (no usa una API externa).
                </small>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/recomendaciones-vendedor.js}"></script>

</body>
</html>
