<div th:fragment="modalCancelarCita">
    <div class="modal fade"
         id="modalCancelarCita"
         tabindex="-1"
         aria-labelledby="modalCancelarCitaLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalCancelarCitaLabel">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Confirmar cancelación
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">

                    <p class="text-muted mb-3">
                        Ingresa el motivo de cancelación para registrar el cambio.
                    </p>

                    <input type="hidden"
                           id="cancelarCitaId"
                           value="">

                    <div class="mb-3">
                        <label for="cancelarMotivo" class="form-label fw-bold">
                            Motivo
                            <span class="text-danger">*</span>
                        </label>

                        <textarea id="cancelarMotivo"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Ej. Cambio de fecha, emergencia, etc."
                                  required></textarea>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button"
                            class="btn btn-danger fw-bold"
                            id="btnConfirmarCancelarCita">

                        <i class="fas fa-times me-1"></i>
                        Sí, cancelar

                    </button>

                </div>

            </div>
        </div>

    </div>

</div>
