<div th:fragment="modalReprogramarCita">

    <div class="modal fade"
         id="modalReprogramarCita"
         tabindex="-1"
         aria-labelledby="modalReprogramarCitaLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow-lg">

                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="modalReprogramarCitaLabel">
                        <i class="fas fa-calendar-alt me-2"></i>
                        Reprogramar cita
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">

                    <p class="text-muted mb-3">
                        Ingresa la nueva fecha y hora para reprogramar esta cita.
                    </p>

                    <input type="hidden"
                           id="reprogramarCitaId"
                           value="">

                    <form id="formReprogramarCita">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="reprogramarFecha" class="form-label fw-bold">
                                    Nueva fecha
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="date"
                                       id="reprogramarFecha"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label for="reprogramarHora" class="form-label fw-bold">
                                    Nueva hora
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="time"
                                       id="reprogramarHora"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-12">
                                <label for="reprogramarMotivo" class="form-label fw-bold">
                                    Motivo (opcional)
                                </label>

                                <textarea id="reprogramarMotivo"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Ej. Emergencia / disponibilidad del veterinario / cambio de horario"></textarea>
                            </div>

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button"
                            class="btn btn-warning fw-bold"
                            id="btnConfirmarReprogramar">

                        <i class="fas fa-rotate-right me-1"></i>
                        Confirmar reprogramación

                    </button>

                </div>

            </div>
        </div>

    </div>

</div>
