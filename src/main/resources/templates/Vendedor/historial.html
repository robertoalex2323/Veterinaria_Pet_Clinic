<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'historial')}" >
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas - Vendedor</title>
    <link rel="stylesheet" th:href="@{/css/historial_ventas-vendedor.css}" />
</head>
<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="fas fa-history text-primary me-2"></i> Historial de Ventas</h2>
            <p class="text-muted mb-0">Busca y navega el historial de ventas.</p>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search -->
    <div class="card shadow-sm">
        <div class="card-header">
            <strong><i class="fas fa-search me-2"></i> Búsqueda</strong>
        </div>
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">Escribe nombre/teléfono/mascota</label>
                    <input id="busqueda" class="form-control" type="text" placeholder="Ej: Juan, 999..., gato, raza..." />
                    <div class="form-text">Presiona <b>Buscar</b> para aplicar la búsqueda.</div>
                </div>
                <div class="col-md-4">
                    <button id="btnBuscar" class="btn btn-primary w-100">
                        <i class="fas fa-search me-2"></i> Buscar
                    </button>
                </div>
            </div>

            <!-- Suggestions (opcional, solo si el backend devuelve datos) -->
            <div id="sugerencias" class="mt-3" style="display:none;">
                <div class="text-muted small mb-2">Resultados sugeridos (clic para filtrar):</div>
                <div id="listaSugerencias" class="list-group"></div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong><i class="fas fa-receipt me-2"></i> Ventas</strong>
            <span class="text-muted small" th:text="${pageInfoText ?: ''}"></span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th style="width:110px;">ID</th>
                        <th>Cliente</th>
                        <th>Método</th>
                        <th>Fecha</th>
                        <th style="width:160px;">Total</th>
                        <th style="width:180px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${ventas == null or #lists.isEmpty(ventas)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay ventas para mostrar.</td>
                    </tr>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.id}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${v.cliente != null ? v.cliente.nombre : ''}"></div>
                            <div class="text-muted small" th:text="${v.cliente != null ? v.cliente.telefono : ''}"></div>
                        </td>
                        <td th:text="${v.metodoPago}"></td>
                        <td th:text="${v.fecha != null ? v.fecha : ''}"></td>
                        <td th:text="${v.total != null ? v.total : 0}"></td>
                        <td>
                            <div class="btn-group" role="group">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/vendedor/ventas/ver/{id}(id=${v.id})}">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-outline-primary btn-sm" th:href="@{/vendedor/ventas/emitir?ventaId={id}(id=${v.id})}">
                                    <i class="fas fa-print"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${page != null}" class="d-flex justify-content-center mt-4">
                <nav aria-label="Paginación">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/vendedor/ventas/historial(page=${page.number - 1},size=${size},q=${q ?: ''})}" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link" th:href="@{/vendedor/ventas/historial(page=${i},size=${size},q=${q ?: ''})}" th:text="${i + 1}"></a>
                        </li>

                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/vendedor/ventas/historial(page=${page.number + 1},size=${size},q=${q ?: ''})}" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>

</div>

<!-- JS -->
<script th:src="@{/js/historial-ventas-vendedor.js}"></script>
</body>
</html>
