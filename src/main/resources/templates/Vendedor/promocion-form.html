<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'promociones')}">

<head>
    <meta charset="UTF-8">
    <title>Crear/Editar Promoción - Vendedor</title>
    <link rel="stylesheet" th:href="@{/css/promociones-vendedor.css}" />
</head>

<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="fas fa-tags text-primary"></i>
                <span th:text="${modo == 'editar'} ? 'Editar Promoción' : 'Nueva Promoción'">Promoción</span>
            </h2>
            <p class="text-muted mb-0">Completa los datos de la promoción</p>
        </div>
        <div>
            <a class="btn btn-outline-secondary shadow-sm" th:href="@{/vendedor/promociones}">
                <i class="fas fa-arrow-left me-2"></i> Volver
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form id="promocionForm" th:action="@{/vendedor/promociones/guardar}" method="post"
                  th:object="${promocion}" novalidate>

                <input type="hidden" name="id" th:value="${promocion != null ? promocion.id : ''}" />

                <div class="row g-4">

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Nombre de la promoción <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                            <input type="text" class="form-control" name="nombre" th:value="*{nombre}" maxlength="255" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Tipo de promoción <span class="text-danger">*</span></label>
                        <select class="form-select" name="tipo" required>
                            <option value="">Selecciona un tipo</option>
                            <option value="PORCENTAJE" th:selected="${promocion != null && promocion.tipo == 'PORCENTAJE'}">Descuento por porcentaje (%)</option>
                            <option value="2X1" th:selected="${promocion != null && promocion.tipo == '2X1'}">2x1</option>
                            <option value="FIJO" th:selected="${promocion != null && promocion.tipo == 'FIJO'}">Descuento fijo (S/)</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Descuento <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-percent"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control" name="descuento" th:value="*{descuento}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Monto mínimo de compra (opcional)</label>
                        <div class="input-group">
                            <span class="input-group-text">S/</span>
                            <input type="number" step="0.01" min="0" class="form-control" name="montoMinimo" th:value="*{montoMinimo}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Producto específico</label>
                        <select class="form-select" name="productoId">
                            <option value="">Aplica a varios / todos</option>
                            <option th:each="p : ${productos}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre + ' (' + p.categoria + ')'}"
                                    th:selected="${promocion != null && promocion.productoId != null && promocion.productoId == p.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Categoría aplicable</label>
                        <select class="form-select" name="categoriaAplicable">
                            <option value="">Aplica a todas las categorías</option>
                            <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
                                    th:selected="${promocion != null and promocion.categoriaAplicable == c}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Fecha inicio (opcional)</label>
                        <input type="date" class="form-control" name="fechaInicio" th:value="*{fechaInicio}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Fecha fin (opcional)</label>
                        <input type="date" class="form-control" name="fechaFin" th:value="*{fechaFin}">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold text-dark mb-2">Días de la semana (opcional, deja vacío para todos los días)</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check" th:each="dia : ${ {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',7:'Domingo'} }">
                                <input class="form-check-input" type="checkbox" name="diasSemana"
                                       th:id="${'dia_' + dia.key}" th:value="${dia.key}"
                                       th:checked="${diasSeleccionados != null && diasSeleccionados.contains('' + dia.key)}">
                                <label class="form-check-label" th:for="${'dia_' + dia.key}" th:text="${dia.value}"></label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold text-dark">Descripción (opcional)</label>
                        <textarea class="form-control" name="descripcion" rows="3" maxlength="500" th:text="*{descripcion}"></textarea>
                    </div>

                    <div class="col-md-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="activaCheck"
                                   name="activo" value="true" th:checked="${promocion == null || promocion.activo == null || promocion.activo}">
                            <input type="hidden" name="activo" value="false">
                            <label class="form-check-label fw-bold" for="activaCheck">Promoción activa</label>
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" th:href="@{/vendedor/promociones}">Cancelar</a>
                    <button type="submit" class="btn btn-primary shadow-sm" id="btnGuardarPromocion">
                        <i class="fas fa-save me-2"></i> Guardar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script th:src="@{/js/promociones-vendedor.js}"></script>
</div>
</body>
</html>
