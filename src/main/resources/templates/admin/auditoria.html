<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sildebar_admin::layout(~{::content}, 'auditoria')}">
<head>
    <title>Auditoria - Administrador</title>
</head>
<body>
<div th:fragment="content">
    <div class="admin-header">
        <div>
            <h2><i class="fas fa-clipboard-list text-primary"></i> Auditoria</h2>
            <p>Registro de acciones administrativas con usuario, fecha y hora.</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha y hora</th>
                            <th>Usuario</th>
                            <th>Accion</th>
                            <th>Entidad</th>
                            <th>ID</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${#temporals.format(log.fechaHora, 'dd/MM/yyyy HH:mm:ss')}">-</td>
                            <td class="fw-bold" th:text="${log.usuario}">admin</td>
                            <td><span class="badge bg-dark" th:text="${log.accion}">CREAR</span></td>
                            <td th:text="${log.entidad}">Usuario</td>
                            <td th:text="${log.entidadId != null ? log.entidadId : '-'}">1</td>
                            <td th:text="${log.detalle}">Detalle</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center text-muted py-4">Aun no hay registros de auditoria.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
