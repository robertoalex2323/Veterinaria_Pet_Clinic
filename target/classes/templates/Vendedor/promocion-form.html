<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/sidebar_vendedor::layout(~{::div#content}, 'producto')}">

<head>
    <meta charset="UTF-8">
    <title>Crear/Editar Producto - Vendedor</title>
    <link rel="stylesheet" th:href="@{/css/producto-vendedor.css}" />
</head>

<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
<h2 class="mb-0"><i class="fas fa-box text-primary"></i> <span th:text="${producto != null && producto.id != null ? 'Editar Producto' : 'Nuevo Producto'}">Producto</span></h2>
            <p class="text-muted mb-0">Completa los datos del producto</p>
        </div>
        <div>
            <a class="btn btn-outline-secondary shadow-sm" th:href="@{/vendedor/productos}">
                <i class="fas fa-arrow-left me-2"></i> Volver
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm producto-card">
        <div class="card-body p-4">
            <form id="productoForm" th:action="@{/vendedor/productos/guardar}" method="post" enctype="multipart/form-data" th:object="${producto}" novalidate>
                <input type="hidden" name="id" th:value="${producto != null ? producto.id : ''}" />
                <div class="row g-4 producto-form-grid">

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Nombre <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                            <input type="text" class="form-control" name="nombre" th:value="*{nombre}" maxlength="255" required>
                        </div>
                        <div class="invalid-feedback d-block d-none" data-error-for="nombre">Ingresa el nombre del producto.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Categoría <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-layer-group"></i></span>
                            <input type="text" class="form-control" name="categoria" th:value="*{categoria}" list="categoriasList" maxlength="50" autocomplete="off" required>
                        </div>
                        <datalist id="categoriasList">
                            <option th:each="cat : ${categorias}" th:value="${cat}"></option>
                        </datalist>
                        <div class="text-muted small mt-1">Escribe una nueva o elige una existente para mantener el catálogo ordenado.</div>
                        <div class="invalid-feedback d-block d-none" data-error-for="categoria">Ingresa la categoría.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Precio (S/) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-dollar-sign"></i></span>
                            <input type="number" step="0.01" min="0.01" max="999999.99" class="form-control" name="precio" th:value="*{precio}" required>
                        </div>
                        <div class="invalid-feedback d-block d-none" data-error-for="precio">Ingresa un precio mayor a 0.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Stock <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-cubes"></i></span>
                            <input type="number" step="1" min="0" class="form-control" name="stock" th:value="*{stock}" required>
                        </div>
                        <div class="invalid-feedback d-block d-none" data-error-for="stock">El stock no puede ser negativo.</div>
                    </div>

                    <div class="col-md-12">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-bold text-dark mb-0">Descripción</label>
                            <span class="text-muted small" id="descripcionCounter">0 / 500</span>
                        </div>
                        <textarea class="form-control" name="descripcion" id="descripcionInput" rows="4" maxlength="500" th:text="*{descripcion}"></textarea>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold text-dark">Foto del producto</label>

                        <div class="pf-foto-row">
                            <div class="pf-foto-preview" id="fotoPreviewWrap">
                                <img id="fotoPreviewImg"
                                     th:if="${producto != null && producto.foto != null && !#strings.isEmpty(producto.foto)}"
                                     th:src="${producto.foto}"
                                     alt="Foto actual del producto"
                                     class="pf-foto-img" />
                                <div id="fotoPreviewPlaceholder"
                                     class="pf-foto-placeholder"
                                     th:classappend="${producto != null && producto.foto != null && !#strings.isEmpty(producto.foto)} ? 'd-none' : ''">
                                    <i class="fas fa-image"></i>
                                </div>
                            </div>

                            <div class="flex-grow-1">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-upload"></i></span>
                                    <input type="file" class="form-control" id="fotoInput" name="foto" accept="image/png,image/jpeg,image/webp,image/gif">
                                </div>
                                <div class="text-muted small mt-1">Opcional. JPG, PNG, WEBP o GIF, máx. 2MB.</div>

                                <div class="form-check mt-2"
                                     th:if="${producto != null && producto.foto != null && !#strings.isEmpty(producto.foto)}">
                                    <input class="form-check-input" type="checkbox" id="eliminarFotoCheck" name="eliminarFoto" value="true">
                                    <label class="form-check-label small" for="eliminarFotoCheck">
                                        Quitar la foto actual (sin subir una nueva)
                                    </label>
                                </div>
                                <div class="text-danger small mt-1 d-none" id="fotoError"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" th:href="@{/vendedor/productos}">Cancelar</a>
                    <button type="submit" class="btn btn-primary shadow-sm" id="btnGuardarProducto">
                        <i class="fas fa-save me-2"></i> Guardar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/producto-form-vendedor.js}"></script>
</body>
</html>
